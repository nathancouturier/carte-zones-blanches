# Configuration du pipeline de données de couverture.
# Tout ce qui est ajustable est ici : grille, limites de taille, emprise (pays et
# régions), opérateurs et sources.

grid:
  max_zoom: 12        # zoom de la grille commune (tuiles de 256 px, EPSG:3857)
  min_zoom: 0
  tile_size: 256
  block_zoom: 8       # zoom des blocs qui servent à répartir les tuiles entre les archives

limits:
  archive_max_mb: 90  # chaque fichier doit rester sous 95 Mo
  site_max_mb: 900    # taille totale du site publié
  target_archive_mb: 70

# Nombre de points tirés au hasard par fichier source pour le test de cohérence
# (source contre pixels décodés du PMTiles).
verification:
  candidates_per_file: 240
  points_per_file: 60
  seed: 20261113

# Ce que le site en ligne utilise. Le workflow « Données » ne publie que cette combinaison :
# tout autre périmètre est un essai, construit et vérifié mais jamais publié.
production:
  scope: complet
  services: [data, voice]

# ---------------------------------------------------------------------------
# Emprise : pays couverts, dans l'ordre de priorité aux frontières (le premier
# pays qui revendique un pixel le garde).
#   code      : valeur du pays dans les bits 0 à 3 du canal B des tuiles
#   eu_roaming: faux pour les pays hors de l'itinérance UE (avertissement dans le rapport)
#   slots     : opérateurs rangés dans les emplacements 0 à 3 des canaux R et G
# ---------------------------------------------------------------------------
countries:
  FR:
    code: 1
    eu_roaming: true
    mask:
      type: etalab_departements
      url: https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/latest/geojson/departements-5m.geojson.gz
      # France métropolitaine, Corse comprise : les départements dont le code a 2 caractères.
      metropole_only: true
      # Mention du contour, reprise dans le manifest et affichée dans le panneau Sources.
      credit: {text: "Contours administratifs (Etalab), d'après ADMIN EXPRESS de l'IGN"}
    slots:
      - {id: orange, name: Orange, arcep: OF}
      - {id: sfr, name: SFR, arcep: SFR0}
      - {id: bouygues, name: Bouygues Telecom, arcep: BOUY}
      - {id: free, name: Free, arcep: FREE}
    sources: [fr_arcep]

  CH:
    code: 2
    eu_roaming: false
    # Contour : swisstopo, swissBOUNDARIES3D (état au 1er janvier 2026). Adresse à mettre à jour une fois par an.
    mask:
      type: vector_file
      url: https://data.geo.admin.ch/ch.swisstopo.swissboundaries3d/swissboundaries3d_2026-01/swissboundaries3d_2026-01_2056_5728.gpkg.zip
      layer: tlm_landesgebiet
      where: "icc = 'CH'"
      expect: 1
      delete_after: true
      credit: {text: "© swisstopo, swissBOUNDARIES3D", url: "https://www.swisstopo.admin.ch/en/terms-of-use-free-geodata-and-geoservices"}
    # La source suisse ne dit pas quel opérateur couvre, seulement combien : les emplacements portent des seuils.
    operators: [Swisscom, Sunrise, Salt]
    slots:
      - {id: ch_1, min_operators: 1}
      - {id: ch_3, min_operators: 3}
    sources: [ch_bakom]

  IT:
    code: 3
    eu_roaming: true
    # Contour : ISTAT, limites administratives non généralisées au 1er janvier 2026 (Piemonte, Valle d'Aosta, Liguria).
    mask:
      type: vector_file
      url: https://www.istat.it/storage/cartografia/confini_amministrativi/non_generalizzati/2026/Limiti01012026.zip
      member: Reg01012026/Reg01012026_WGS84.shp
      where: "COD_REG IN (1, 2, 7)"
      expect: 3
      delete_after: true
      credit: {text: "Istat, Confini delle unità amministrative a fini statistici al 1° gennaio 2026, CC BY 4.0, données modifiées", url: "https://creativecommons.org/licenses/by/4.0/deed.it"}
    # La source italienne donne un nombre de réseaux 4G par carré (1 à 4), sans les nommer.
    slots:
      - {id: it_1, min_operators: 1}
      - {id: it_2, min_operators: 2}
      - {id: it_3, min_operators: 3}
      - {id: it_4, min_operators: 4}
    sources: [it_agcom]

  ES:
    code: 4
    eu_roaming: true
    # Contour : IGN España, unités administratives (Aragón, Cataluña, Navarra, País Vasco), une requête par communauté.
    mask:
      type: vector_file
      expect: 4
      credit: {text: "Obra derivada de BDLJE CC-BY 4.0 ign.es", url: "https://www.ign.es/resources/licencia/Condiciones_licenciaUso_IGN.pdf"}
      urls:
        - {url: "https://api-features.ign.es/collections/administrativeunit/items?f=json&nationalcode=34020000000", filename: es-34020000000.geojson}
        - {url: "https://api-features.ign.es/collections/administrativeunit/items?f=json&nationalcode=34090000000", filename: es-34090000000.geojson}
        - {url: "https://api-features.ign.es/collections/administrativeunit/items?f=json&nationalcode=34150000000", filename: es-34150000000.geojson}
        - {url: "https://api-features.ign.es/collections/administrativeunit/items?f=json&nationalcode=34160000000", filename: es-34160000000.geojson}
    # « cif » : identifiant fiscal de l'opérateur dans le champ COBERTURA de la carte du ministère.
    slots:
      - {id: movistar, name: Movistar, cif: A78923125}
      - {id: orange_es, name: Orange, cif: A82009812}
      - {id: vodafone, name: Vodafone, cif: A80907397}
      - {id: xfera, name: Xfera Móviles, cif: A82528548}
    sources: [es_mtd]

  AD:
    code: 5
    eu_roaming: false
    # Contour : OpenStreetMap (relation 9407), extrait quotidien de Geofabrik.
    mask:
      type: vector_file
      url: https://download.geofabrik.de/europe/andorra-latest.osm.pbf
      layer: multipolygons
      where: "osm_id = '9407'"
      expect: 1
      # OpenStreetMap est modifiable par tous : on vérifie que la surface reste celle de l'Andorre (467,5 km2 mesurés).
      expect_area_km2: [455, 480]
      credit: {text: "© OpenStreetMap contributors (ODbL 1.0)", url: "https://www.openstreetmap.org/copyright"}
    # Pas de carte officielle : estimation, tous réseaux du pays confondus.
    slots:
      - {id: ad_1, min_operators: 1}
    sources: [ad_estimation]

  MC:
    code: 6
    eu_roaming: false
    # Contour : OpenStreetMap, terre ferme de Monaco (relation 36990, sans les eaux territoriales).
    mask:
      type: osm_land_area
      url: https://download.geofabrik.de/europe/monaco-latest.osm.pbf
      relation: 36990
      # Terre ferme de Monaco : 2,08 km2 mesurés (la marge laisse la place à un nouveau terrain gagné sur la mer).
      expect_area_km2: [1.9, 2.4]
      credit: {text: "© OpenStreetMap contributors (ODbL 1.0)", url: "https://www.openstreetmap.org/copyright"}
    slots:
      - {id: mc_1, min_operators: 1}
    sources: [mc_estimation]

# ---------------------------------------------------------------------------
# Estimation, pour les pays sans carte officielle : réglages communs.
# Antennes : OpenCellID (clé gratuite dans le secret OPENCELLID_TOKEN) ; relief : Copernicus DEM GLO-30.
# La règle à trois niveaux a été calée sur la France, où la vérité officielle existe (docs/sources.md).
# ---------------------------------------------------------------------------
estimation: &estimation
  module: estimation_opencellid
  type: 2
  name: "Estimation : antennes OpenCellID et relief Copernicus DEM"
  attribution: "Estimation : OpenCellID (CC BY-SA 4.0), Copernicus DEM"
  url: https://opencellid.org
  licence: CC BY-SA 4.0 (zones estimées, dérivées d'OpenCellID)
  licence_url: https://creativecommons.org/licenses/by-sa/4.0/
  licence_notice: "Cell tower data from OpenCellID, licensed under CC BY-SA 4.0. Produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved. The organisations in charge of the Copernicus programme by law or by delegation do not incur any liability for any use of the Copernicus WorldDEM-30."
  # Page qui donne les liens de téléchargement une fois la clé envoyée.
  downloads_page: https://opencellid.org/downloads.php
  dem_url: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{ns}{lat:02d}_00_{ew}{lon:03d}_00_DEM/Copernicus_DSM_COG_10_{ns}{lat:02d}_00_{ew}{lon:03d}_00_DEM.tif"
  services:
    data: {techno: 4G et 5G, radios: [LTE, NR]}
  levels_kind: three          # pas de couverture, limitée, bonne : jamais « très bonne »
  antenna_height_m: 30
  mobile_height_m: 1.5
  curvature: 0.75             # réfraction atmosphérique usuelle en radio (rayon terrestre de 4/3)
  near_miss_m: 30             # « presque visible » : il manque moins de 30 m pour voir l'antenne
  site_merge_m: 300           # deux points à moins de 300 m forment un seul site
  station_spread_max_m: 2000  # au-delà, des cellules de même identifiant de station ne sont pas réunies
  min_samples: 1
  # Distances maximales (km) au site visible, presque visible ou quelconque le plus proche.
  good: {visible_km: 5, near_km: 1, any_km: 0.5}
  limited: {visible_km: 15, near_km: 7.5, any_km: 2}
  resolution_m: 30

# ---------------------------------------------------------------------------
# Sources de données. Un module Python par type de source dans czb/sources/.
# Une source désigne son module par « module », ou à défaut par son propre nom.
# ---------------------------------------------------------------------------
sources:
  fr_arcep:
    country: FR
    type: 0             # 0 officielle par opérateur, 1 officielle agrégée, 2 estimée
    name: "Arcep, Mon réseau mobile : couvertures théoriques"
    attribution: Arcep
    url: https://www.data.gouv.fr/datasets/mon-reseau-mobile
    licence: Licence Ouverte / Open Licence (Etalab)
    licence_url: https://www.etalab.gouv.fr/licence-ouverte-open-licence
    listing_url: https://data.arcep.fr/mobile/couvertures_theoriques/last/Metropole/00_Metropole/
    # Nom des fichiers : {trimestre}_couv_Metropole_{OP}_{TECHNO}_{USAGE}.gpkg.7z
    services:
      data: {techno: 4G, usage: data}
      voice: {techno: 2G3G, usage: voix}
    # Champ « niveau » des fichiers. L'absence de polygone vaut 0 (pas de couverture).
    level_field: niveau
    levels: {CL: 1, BC: 2, TBC: 3}
    levels_kind: four
    resolution_m: 50

  ch_bakom:
    country: CH
    type: 1
    name: "OFCOM, atlas de la large bande : disponibilité des réseaux mobiles 4G"
    attribution: OFCOM
    url: https://www.bakom.admin.ch/en/broadband-atlas
    licence: Utilisation libre, source à citer (géodonnées de la Confédération)
    licence_url: https://www.geo.admin.ch/en/general-terms-of-use-fsdi
    stac_url: "https://data.geo.admin.ch/api/stac/v0.9/collections/{collection}/items"
    services:
      data: {techno: 4G, collection: ch.bakom.mobilnetz-4g}
    # Valeurs du GeoTIFF : 0 = pas de couverture, 2 = couvert par moins de 3 opérateurs, 3 = couvert par les 3.
    # On en tire le nombre MINIMAL d'opérateurs : 0, 1 ou 3.
    values: {0: 0, 2: 1, 3: 3}
    covered_level: 2      # la source dit « couvert » ou non, sans niveau de qualité
    levels_kind: binary
    per_operator: true    # les emplacements (seuils) se choisissent un par un
    resolution_m: 100

  it_agcom:
    country: IT
    type: 1
    name: "AGCOM, Broadband Map : couverture mobile 4G (nombre de réseaux par carré de 100 m)"
    attribution: BroadbandMap di Agcom (CC BY 4.0)
    url: https://www.agcom.it/broadband-map
    licence: Creative Commons Attribuzione 4.0 Internazionale (CC BY 4.0)
    licence_url: https://www.agcom.it/termini-e-condizioni
    # La licence demande d'afficher ce logo dans toute œuvre dérivée (fichier public/licences/).
    licence_logo: licences/agcom-bbmap.jpg
    licence_notice: "BroadbandMap di Agcom - Autorità per le garanzie nelle comunicazioni è distribuito con Licenza Creative Commons Attribuzione 4.0 Internazionale."
    service_url: https://geo3.agcom.it/MapET-SFS/rest/services/Grid100/mobile_4G/MapServer
    query_url: https://geo3.agcom.it/MapET-SFS/rest/services/Grid100/mobile_4G/MapServer/0/query
    date_url: https://geo3.agcom.it/MapET-SFS/rest/services/Grid100/data_pubblicazione/FeatureServer/0/query
    date_field: commento
    oid_field: fid
    region_field: COD_REG
    regions: [1, 2, 7]    # Piemonte, Valle d'Aosta, Liguria
    page_size: 250
    pause_s: 1
    services:
      data: {techno: 4G}
    count_field: n_infrastrutture_totali
    values: {1: 1, 2: 2, 3: 3, 4: 4}
    covered_level: 2
    levels_kind: binary
    per_operator: true
    resolution_m: 100

  es_mtd:
    country: ES
    type: 0
    name: "Ministerio para la Transformación Digital y de la Función Pública, Mapa de Servicios de Banda Ancha Móvil 2024 (4G)"
    attribution: "Origen de los datos: Ministerio para la Transformación Digital y de la Función Pública"
    url: https://digital.gob.es/telecomunicaciones-infraestructuras-digitales/areas-interes/banda-ancha/informacion-cobertura/mapas-servicios-banda-ancha
    licence: Condiciones generales de reutilización (réutilisation libre, source et date à citer)
    licence_url: https://digital.gob.es/nota-legal
    item_url: https://www.arcgis.com/sharing/rest/content/items/ef9f55c81f304e5185fcdd7cecf98e7f
    layer_url: https://services-eu1.arcgis.com/3LqdsBPalJaUFvo1/arcgis/rest/services/InfoCob4G_2024/FeatureServer/0
    oid_field: OBJECTID
    region_field: CCOM
    regions: ["02", "09", "15", "16"]   # Aragón, Cataluña, Navarra, País Vasco
    operator_field: COBERTURA
    operator_separator: ";"
    page_size: 2000
    pause_s: 0.5
    # Grille d'origine de la source (EPSG:4258) : pas de l'image « Cob4G_2024 » du ministère, et point de référence
    # (coin nord-ouest de cette image). Les polygones sont des assemblages de mailles de ce pas, décalés d'une
    # fraction de maille par rapport à ce point : le module mesure ce décalage à chaque lecture.
    grid_step_deg: 0.000346111018645788
    grid_origin: [-18.356176100718844, 43.95448719807852]
    services:
      data: {techno: 4G}
    covered_level: 2      # présence d'un réseau 4G, sans niveau de qualité
    levels_kind: binary
    # Date des données, écrite dans le texte de la carte (« cobertura referida a 30 de junio de 2024 »).
    data_date: "2024-06-30"
    resolution_m: 38

  ad_estimation:
    <<: *estimation
    country: AD
    mcc: [213]

  mc_estimation:
    <<: *estimation
    country: MC
    mcc: [212]

# ---------------------------------------------------------------------------
# Périmètres de construction (option --scope).
# ---------------------------------------------------------------------------
scopes:
  # Prototype : un département de montagne.
  hautes-alpes:
    countries: [FR]
    departements: ["05"]
  france:
    countries: [FR]
  # Un pays à la fois, pour mettre au point une source.
  suisse:
    countries: [CH]
  italie:
    countries: [IT]
  espagne:
    countries: [ES]
  # L'Espagne avec la couverture d'une seule région (le Pays basque) : la chaîne complète en quelques minutes.
  espagne-essai:
    countries: [ES]
    source_overrides:
      es_mtd: {regions: ["16"]}
  andorre-monaco:
    countries: [AD, MC]
  # Alpes : cinq départements, la Suisse et l'Italie. Essai d'ensemble rapide (frontières, interstices, plusieurs pays).
  alpes:
    countries: [FR, CH, IT]
    departements: ["04", "05", "06", "73", "74"]
  # Les départements frontaliers et tous les pays voisins : essai d'ensemble plus rapide que « complet ».
  frontieres:
    countries: [FR, CH, IT, ES, AD, MC]
    departements: ["01", "04", "05", "06", "09", "25", "31", "39", "64", "65", "66", "68", "73", "74", "90"]
  # Tout : c'est ce que le workflow « Données » construit chaque mois.
  complet:
    countries: [FR, CH, IT, ES, AD, MC]
