# Construit les tuiles de couverture et les publie dans une release data-AAAA-MM-JJ.
# Se lance à la main et une fois par mois. Ne reconstruit que si une source a changé
# (nouveau trimestre Arcep, nouvelle édition d'une source étrangère).
#
# Seule la « production » (périmètre et services de pipeline/config.yaml, section production)
# est publiée et mise en ligne. Tout autre périmètre est un essai : il est construit et
# vérifié, son résultat est gardé 7 jours en artefact, mais il ne remplace jamais les
# données du site.
name: Données
run-name: "Données : ${{ inputs.scope || 'production' }}"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Périmètre : production (celui du site) ou un périmètre d'essai, jamais publié"
        type: choice
        options: [production, complet, frontieres, alpes, france, suisse, italie, espagne, espagne-essai, andorre-monaco, hautes-alpes]
        default: production
      services:
        description: "Services d'un essai : data ou data,voice (ignoré pour la production)"
        type: string
        default: data
      force:
        description: "Reconstruire même si aucune source n'a changé"
        type: boolean
        default: false
  schedule:
    - cron: "23 3 5 * *" # le 5 de chaque mois à 3 h 23 UTC

# Une seule construction de production à la fois ; les essais lancés à la main ne se gênent pas.
concurrency:
  group: donnees-${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'production') && github.run_id || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.13.3
    timeout-minutes: 340
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      date: ${{ steps.params.outputs.date }}
      scope: ${{ steps.params.outputs.scope }}
      services: ${{ steps.params.outputs.services }}
      publish: ${{ steps.params.outputs.publish }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENCELLID_TOKEN: ${{ secrets.OPENCELLID_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Outils
        shell: bash
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends p7zip-full python3-pip >/dev/null
          python3 -m pip install --break-system-packages -q -r pipeline/requirements.txt
          gdalinfo --version
          python3 -c "import numpy, PIL, pmtiles, yaml; print('numpy', numpy.__version__, 'pillow', PIL.__version__)"

      - name: Production (config.yaml)
        id: production
        working-directory: pipeline
        run: python3 -m czb.cli production

      - name: Paramètres
        id: params
        shell: bash
        env:
          IN_SCOPE: ${{ inputs.scope }}
          IN_SERVICES: ${{ inputs.services }}
          IN_FORCE: ${{ inputs.force }}
          PROD_SCOPE: ${{ steps.production.outputs.prod_scope }}
          PROD_SERVICES: ${{ steps.production.outputs.prod_services }}
        run: |
          # Passage mensuel et lancement à la main sans choix : la production, telle que config.yaml la décrit.
          scope="${IN_SCOPE:-production}"; services="${IN_SERVICES:-data}"; force="${IN_FORCE:-false}"
          # On ne publie que le choix « production » (passage mensuel compris), jamais un essai, même s'il a les
          # mêmes réglages. C'est aussi ce choix qui range la construction dans le groupe « production »
          # (voir concurrency) : une seule publication à la fois.
          publish=false
          if [ "$scope" = "production" ]; then publish=true; scope="$PROD_SCOPE"; services="$PROD_SERVICES"; fi
          case "$scope" in *[!a-z0-9-]*|"") echo "scope invalide : $scope"; exit 1 ;; esac
          case "$services" in data|data,voice) ;; *) echo "services invalides : $services"; exit 1 ;; esac
          case "$force" in true|false) ;; *) force=false ;; esac
          # Un essai est toujours construit : il n'a pas de release à laquelle se comparer.
          if [ "$publish" = "false" ]; then force=true; fi
          {
            echo "scope=$scope"
            echo "services=$services"
            echo "force=$force"
            echo "publish=$publish"
            echo "date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "Périmètre : $scope, services : $services, forcé : $force, publication : $publish"

      - name: Tests du pipeline (données synthétiques)
        working-directory: pipeline
        run: python3 -m pytest -q tests

      - name: Une source a-t-elle changé ?
        id: detect
        working-directory: pipeline
        shell: bash
        run: |
          extra=""
          if [ "${{ steps.params.outputs.force }}" = "true" ]; then extra="--force"; fi
          python3 -m czb.cli changed --repo "$GITHUB_REPOSITORY" --scope "${{ steps.params.outputs.scope }}" --services "${{ steps.params.outputs.services }}" $extra

      - name: Copies de travail de la dernière release
        if: steps.detect.outputs.changed == 'true'
        working-directory: pipeline
        run: python3 -m czb.cli fetch-cache --repo "$GITHUB_REPOSITORY" --work work

      - name: Construire les tuiles
        if: steps.detect.outputs.changed == 'true'
        working-directory: pipeline
        run: python3 -m czb.cli build --scope "${{ steps.params.outputs.scope }}" --services "${{ steps.params.outputs.services }}" --work work --out out --date "${{ steps.params.outputs.date }}"

      - name: Test de cohérence (source contre pixels du PMTiles)
        if: steps.detect.outputs.changed == 'true'
        working-directory: pipeline
        run: python3 -m czb.cli verify --out out

      - name: Conserver le résultat
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: donnees
          path: pipeline/out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  publier:
    name: Publier la release
    needs: construire
    if: needs.construire.outputs.changed == 'true' && needs.construire.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DATE: ${{ needs.construire.outputs.date }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: donnees
          path: out

      - name: Créer la release
        id: release
        shell: bash
        run: |
          ls -la out
          # Nom de la release : data-AAAA-MM-JJ, puis data-AAAA-MM-JJ-2, -3... s'il y en a déjà une ce jour-là.
          # On ne supprime jamais une release avant d'avoir publié la suivante.
          existantes=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName')
          tag="data-$DATE"; n=1
          while printf '%s\n' "$existantes" | grep -qx "$tag"; do n=$((n + 1)); tag="data-$DATE-$n"; done
          {
            echo "Tuiles de couverture mobile (PMTiles) et manifest, générés par le workflow Données."
            echo
            echo "- Périmètre : ${{ needs.construire.outputs.scope }} (${{ needs.construire.outputs.services }})"
            echo "- Taille des tuiles : $(du -ch out/*.pmtiles | tail -1 | cut -f1)"
            echo "- Sources, dates et licences : ci-dessous, dans SOURCES.md et manifest.json ; méthodes et limites dans docs/sources.md"
            echo "- Les fichiers cache-*.tif sont des copies de travail reprises par la construction suivante ; le site ne les utilise pas."
            # Les mentions des sources suivent les données : elles sont redites dans le texte de la release.
            if [ -s out/SOURCES.md ]; then echo; cat out/SOURCES.md; fi
          } > notes.md
          # Pas d'option --target : l'étiquette est posée sur la branche par défaut. Le jeton d'Actions n'a pas
          # le droit de créer une étiquette sur un commit dont les workflows diffèrent de ceux de cette branche.
          gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Données de couverture du $DATE" --notes-file notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release publiée : $tag"

      - name: Ne garder que les trois dernières releases de données
        shell: bash
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("data-"))] | sort_by(.publishedAt) | reverse | .[3:] | .[].tagName' \
            | while read -r ancien; do
                echo "Suppression de $ancien"
                gh release delete "$ancien" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
              done

      - name: Relancer le déploiement du site
        shell: bash
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" \
            || echo "Déploiement non relancé : deploy.yml n'est pas encore sur la branche par défaut."

  # GitHub désactive les workflows planifiés d'un dépôt resté 60 jours sans activité. Réactiver le
  # workflow à chaque passage mensuel remet ce compteur à zéro.
  garder-actif:
    name: Garder le passage mensuel actif
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Réactiver ce workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/build-data.yml/enable" && echo "Workflow Données réactivé."
