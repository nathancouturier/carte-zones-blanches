# Construit le site et le publie sur GitHub Pages.
# Se lance à chaque push sur main, après chaque nouvelle release de données, et à la main.
name: Déploiement

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sans_donnees:
        description: "Publier même s'il n'existe aucune release de données"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Données de la dernière release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p public/data
          # La plus récente par date de PUBLICATION : la date de création d'une release est celle du commit
          # étiqueté, identique pour toutes les releases posées sur le même commit.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,publishedAt \
            --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("data-"))] | sort_by(.publishedAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            if [ "${{ inputs.sans_donnees }}" = "true" ]; then
              echo "::warning::Aucune release de données : le site est publié sans couche réseau."
              exit 0
            fi
            # On préfère échouer : le site déjà en ligne garde ses données.
            echo "::error::Aucune release de données (data-AAAA-MM-JJ). Lancer le workflow Données, ou relancer ce déploiement avec l'option sans_donnees."
            exit 1
          fi
          echo "Release de données : $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir public/data --pattern '*.pmtiles' --pattern 'manifest.json'
          ls -la public/data
          # Toutes les archives citées par le manifest doivent être là.
          for f in $(jq -r '.archives[].file' public/data/manifest.json); do
            [ -s "public/data/$f" ] || { echo "::error::Archive absente de la release $tag : $f"; exit 1; }
          done

      - name: Construire
        run: npm run build

      - name: Contrôle des tailles
        shell: bash
        run: |
          # Chaque fichier doit rester sous 95 Mo, et le site complet sous 900 Mo.
          gros=$(find dist -type f -size +95M)
          if [ -n "$gros" ]; then echo "Fichier(s) de plus de 95 Mo : $gros"; exit 1; fi
          total=$(du -sm dist | cut -f1)
          echo "Taille du site : ${total} Mo"
          if [ "$total" -gt 900 ]; then echo "Le site dépasse 900 Mo"; exit 1; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
