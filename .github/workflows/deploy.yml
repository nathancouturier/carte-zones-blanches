# Construit le site et le publie sur GitHub Pages.
# Se lance à chaque push sur main, après chaque nouvelle release de données, et à la main.
name: Déploiement

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sans_donnees:
        description: "Publier même s'il n'existe aucune release de données"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Données de la dernière release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p public/data
          # La plus récente par date de PUBLICATION : la date de création d'une release est celle du commit
          # étiqueté, identique pour toutes les releases posées sur le même commit.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,publishedAt \
            --jq '[.[] | select(.isDraft | not) | select(.tagName | startswith("data-"))] | sort_by(.publishedAt) | last | .tagName // empty')
          if [ -z "$tag" ]; then
            if [ "${{ inputs.sans_donnees }}" = "true" ]; then
              echo "::warning::Aucune release de données : le site est publié sans couche réseau."
              exit 0
            fi
            # On préfère échouer : le site déjà en ligne garde ses données.
            echo "::error::Aucune release de données (data-AAAA-MM-JJ). Lancer le workflow Données, ou relancer ce déploiement avec l'option sans_donnees."
            exit 1
          fi
          echo "Release de données : $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir public/data --pattern '*.pmtiles' --pattern 'manifest.json'
          ls -la public/data
          # Le manifest doit être là et lisible, avec toutes les archives qu'il cite. Sinon on échoue :
          # le site déjà en ligne garde ses données.
          test -s public/data/manifest.json || { echo "::error::manifest.json absent de la release $tag"; exit 1; }
          jq -e '.archives | length > 0' public/data/manifest.json >/dev/null || { echo "::error::manifest.json illisible ou sans archive dans la release $tag"; exit 1; }
          jq -r '.archives[].file' public/data/manifest.json > archives.txt
          while read -r f; do
            [ -s "public/data/$f" ] || { echo "::error::Archive absente de la release $tag : $f"; exit 1; }
          done < archives.txt
          rm archives.txt

      - name: Construire
        run: npm run build

      - name: Contrôle des tailles
        shell: bash
        run: |
          # Chaque fichier doit rester sous 95 Mo, et le site complet sous 900 Mo (en millions d'octets, comme le pipeline).
          gros=$(find dist -type f -size +94999999c)
          if [ -n "$gros" ]; then echo "::error::Fichier(s) de 95 Mo ou plus : $gros"; exit 1; fi
          total=$(find dist -type f -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }')
          echo "Taille du site : $((total / 1000000)) Mo"
          if [ "$total" -ge 900000000 ]; then echo "::error::Le site atteint ou dépasse 900 Mo"; exit 1; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Contrôle du site en ligne dans un vrai navigateur (ordinateur, téléphone, plusieurs langues).
  verifier:
    name: Vérifier le site en ligne
    needs: deploy
    uses: ./.github/workflows/verification.yml
